<div id="expressions_helper_container" class="extension_container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Character Expressions Helper</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="expressions_helper_enabled">
                <input id="expressions_helper_enabled" type="checkbox" />
                <span>Enable Sprite Sync</span>
            </label>
            <div class="m-t-1">
                <small>Form A is always the character's default sprite folder. Subfolders are auto-detected and assigned to B/C/D — override below only if needed.</small>
            </div>
            <div class="m-t-1">
                <small>Auto-detected: <strong id="expressions_helper_detected">—</strong></small>
            </div>
            <div class="m-t-1">
                <label for="expressions_helper_form_b">Override Form B</label>
                <input id="expressions_helper_form_b" type="text" class="text_pole" placeholder="auto" />
            </div>
            <div class="m-t-1">
                <label for="expressions_helper_form_c">Override Form C</label>
                <input id="expressions_helper_form_c" type="text" class="text_pole" placeholder="auto" />
            </div>
            <div class="m-t-1">
                <label for="expressions_helper_form_d">Override Form D</label>
                <input id="expressions_helper_form_d" type="text" class="text_pole" placeholder="auto" />
            </div>
            <div class="m-t-1">
                <small>Last sprite: <strong id="expressions_helper_last">—</strong></small>
            </div>
        </div>
    </div>
</div>
